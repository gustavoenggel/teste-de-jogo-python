<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Air Assault - Multiplayer Online</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        body { margin: 0; background-color: #060c1c; color: white; font-family: 'Courier New', Courier, monospace; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; overflow: hidden; }
        canvas { background: linear-gradient(to bottom, #060c1c 0%, #1a4070 100%); box-shadow: 0 0 20px rgba(0,0,0,0.8); display: none; }
        #menu { background: #1a4070; padding: 30px; border-radius: 10px; text-align: center; border: 2px solid #00FFFF; }
        input { padding: 10px; margin: 10px 0; font-family: inherit; font-weight: bold; width: 250px; text-align: center; }
        button { padding: 10px 20px; font-family: inherit; font-weight: bold; background: #00FFFF; border: none; cursor: pointer; margin: 5px; }
        button:hover { background: #00cccc; }
        h1 { color: #00FFFF; margin-top: 0; }
        #roomCode { color: yellow; font-size: 24px; font-weight: bold; letter-spacing: 2px; }
    </style>
</head>
<body>

<div id="menu">
    <h1>AIR ASSAULT ONLINE</h1>
    <div id="step1">
        <button onclick="criarSala()">CRIAR SALA (Jogador 1)</button>
        <br><br><hr><br>
        <input type="text" id="joinId" placeholder="Colar código do amigo..."><br>
        <button onclick="entrarSala()">ENTRAR (Jogador 2)</button>
    </div>
    <div id="step2" style="display:none;">
        <p>O seu código da sala é:</p>
        <p id="roomCode">A CARREGAR...</p>
        <p>Envie este código ao seu amigo e espere que ele entre!</p>
    </div>
    <p id="statusMsg"></p>
</div>

<canvas id="gameCanvas" width="960" height="560"></canvas>

<script>
/** LÓGICA DO JOGO E REDE **/
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height, GROUND_Y = H - 80;

let peer, conn;
let isHost = false;
let myKeys = {};

// Variáveis de Estado do Jogo (O Host controla isto)
let gameState = {
    p1: { x: 160, y: 200, hp: 100, color: '#32CD32', cd: 0 },
    p2: { x: 160, y: 360, hp: 100, color: '#1E90FF', cd: 0 },
    bullets: [], enemies: [], particles: [], score: 0, frame: 0, over: false
};
// Teclas do Cliente recebidas pelo Host
let clientKeys = {};

window.addEventListener('keydown', e => myKeys[e.code] = true);
window.addEventListener('keyup', e => myKeys[e.code] = false);

function mostrarMensagem(msg) { document.getElementById('statusMsg').innerText = msg; }
function iniciarCanvas() {
    document.getElementById('menu').style.display = 'none';
    canvas.style.display = 'block';
    requestAnimationFrame(gameLoop);
}

// === JOGADOR 1 (CRIAR SALA) ===
function criarSala() {
    isHost = true;
    document.getElementById('step1').style.display = 'none';
    document.getElementById('step2').style.display = 'block';
    
    // Gera um ID simples (ex: abc-123)
    const roomID = Math.random().toString(36).substring(2, 5) + "-" + Math.floor(Math.random()*999);
    
    peer = new Peer(roomID);
    
    peer.on('open', id => {
        document.getElementById('roomCode').innerText = id;
    });

    peer.on('connection', connection => {
        conn = connection;
        mostrarMensagem("Amigo conectado! A iniciar jogo...");
        
        conn.on('data', data => { clientKeys = data.keys; }); // Recebe teclas do amigo
        
        setTimeout(iniciarCanvas, 1000);
    });
}

// === JOGADOR 2 (ENTRAR NA SALA) ===
function entrarSala() {
    const id = document.getElementById('joinId').value.trim();
    if (!id) return mostrarMensagem("Escreva um código!");
    
    isHost = false;
    peer = new Peer();
    mostrarMensagem("A ligar ao amigo...");
    
    peer.on('open', () => {
        conn = peer.connect(id);
        conn.on('open', () => {
            mostrarMensagem("Ligado! A preparar o ecrã...");
            setTimeout(iniciarCanvas, 1000);
        });
        
        // Recebe a posição das coisas do Anfitrião e desenha
        conn.on('data', data => { gameState = data.state; });
    });
}

// === MOTOR DO JOGO ===
function spawnExplosion(x, y, color) {
    for (let i = 0; i < 15; i++) {
        let ang = Math.random() * Math.PI * 2, spd = Math.random() * 4;
        gameState.particles.push({ x: x, y: y, vx: Math.cos(ang)*spd, vy: Math.sin(ang)*spd, life: 1, c: color });
    }
}

function updateHostLogic() {
    if (gameState.over) return;
    gameState.frame++;

    // Movimento P1 (Host - WASD)
    let p1 = gameState.p1;
    if (p1.hp > 0) {
        if (myKeys['KeyA']) p1.x -= 5;
        if (myKeys['KeyD']) p1.x += 5;
        if (myKeys['KeyW']) p1.y -= 5;
        if (myKeys['KeyS']) p1.y += 5;
        if (myKeys['Space'] && p1.cd <= 0) {
            gameState.bullets.push({ x: p1.x+20, y: p1.y, vx: 15, vy: 0, f: true });
            p1.cd = 10;
        }
    }
    
    // Movimento P2 (Client - Setas)
    let p2 = gameState.p2;
    if (p2.hp > 0) {
        if (clientKeys['ArrowLeft']) p2.x -= 5;
        if (clientKeys['ArrowRight']) p2.x += 5;
        if (clientKeys['ArrowUp']) p2.y -= 5;
        if (clientKeys['ArrowDown']) p2.y += 5;
        if (clientKeys['Enter'] && p2.cd <= 0) {
            gameState.bullets.push({ x: p2.x+20, y: p2.y, vx: 15, vy: 0, f: true });
            p2.cd = 10;
        }
    }

    // Limites e Cooldowns
    [p1, p2].forEach(p => {
        p.x = Math.max(30, Math.min(W-30, p.x));
        p.y = Math.max(30, Math.min(GROUND_Y-20, p.y));
        if (p.cd > 0) p.cd--;
    });

    // Inimigos
    if (gameState.frame % 60 === 0) gameState.enemies.push({ x: W+50, y: Math.random()*(GROUND_Y-100)+50, hp: 30, cd: 60 });
    
    gameState.enemies.forEach(e => {
        e.x -= 2; e.cd--;
        if (e.cd <= 0) {
            gameState.bullets.push({ x: e.x, y: e.y, vx: -8, vy: 0, f: false });
            e.cd = 100;
        }
    });

    // Balas e Colisões
    gameState.bullets.forEach(b => {
        b.x += b.vx; b.y += b.vy;
        if (b.f) { // Bala amiga
            gameState.enemies.forEach(e => {
                if (e.hp > 0 && Math.hypot(b.x-e.x, b.y-e.y) < 25) {
                    b.y = -1000; e.hp -= 15;
                    if (e.hp <= 0) { gameState.score += 100; spawnExplosion(e.x, e.y, '#FF4500'); }
                }
            });
        } else { // Bala inimiga
            [p1, p2].forEach(p => {
                if (p.hp > 0 && Math.hypot(b.x-p.x, b.y-p.y) < 20) {
                    b.y = -1000; p.hp -= 20;
                    if (p.hp <= 0) spawnExplosion(p.x, p.y, p.color);
                }
            });
        }
    });

    // Partículas
    gameState.particles.forEach(p => { p.x += p.vx; p.y += p.vy; p.life -= 0.02; });

    // Limpeza
    gameState.bullets = gameState.bullets.filter(b => b.x > 0 && b.x < W && b.y > 0);
    gameState.enemies = gameState.enemies.filter(e => e.hp > 0 && e.x > -50);
    gameState.particles = gameState.particles.filter(p => p.life > 0);
    
    if (p1.hp <= 0 && p2.hp <= 0) gameState.over = true;
}

function drawHelicopter(x, y, color) {
    ctx.save(); ctx.translate(x, y);
    ctx.fillStyle = color; ctx.beginPath(); ctx.ellipse(0, 0, 35, 15, 0, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#87CEFA'; ctx.beginPath(); ctx.ellipse(10, -5, 15, 8, 0, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = '#CCC'; ctx.lineWidth = 2; ctx.beginPath();
    let ang = gameState.frame * 0.5;
    ctx.moveTo(0, -15); ctx.lineTo(Math.cos(ang)*40, -15 + Math.sin(ang)*5); ctx.stroke();
    ctx.restore();
}

function gameLoop() {
    ctx.clearRect(0, 0, W, H);
    
    // Desenha Chão
    ctx.fillStyle = '#0a1c10'; ctx.fillRect(0, GROUND_Y, W, H - GROUND_Y);

    if (isHost) {
        updateHostLogic();
        // Host envia o estado todo para o cliente
        if (conn && conn.open) conn.send({ state: gameState });
    } else {
        // Cliente envia as suas teclas para o Host
        if (conn && conn.open) conn.send({ keys: myKeys });
    }

    // Desenha tudo com base no "gameState"
    gameState.particles.forEach(p => {
        ctx.globalAlpha = p.life; ctx.fillStyle = p.c;
        ctx.beginPath(); ctx.arc(p.x, p.y, p.life*5, 0, Math.PI*2); ctx.fill(); ctx.globalAlpha = 1;
    });

    gameState.bullets.forEach(b => {
        ctx.fillStyle = b.f ? '#00FFFF' : '#FF4500';
        ctx.beginPath(); ctx.arc(b.x, b.y, 4, 0, Math.PI*2); ctx.fill();
    });

    gameState.enemies.forEach(e => {
        ctx.fillStyle = '#DC143C'; ctx.fillRect(e.x-20, e.y-10, 40, 20);
        ctx.fillStyle = '#333'; ctx.fillRect(e.x-10, e.y-15, 20, 10);
    });

    if (gameState.p1.hp > 0) drawHelicopter(gameState.p1.x, gameState.p1.y, gameState.p1.color);
    if (gameState.p2.hp > 0) drawHelicopter(gameState.p2.x, gameState.p2.y, gameState.p2.color);

    // HUD
    ctx.fillStyle = 'white'; ctx.font = '20px Courier New'; ctx.textAlign = 'left';
    ctx.fillText(`SCORE: ${gameState.score}`, 20, 30);
    ctx.fillStyle = gameState.p1.hp > 0 ? gameState.p1.color : 'red'; ctx.fillText(`P1 HP: ${Math.max(0, gameState.p1.hp)}`, 20, 60);
    ctx.fillStyle = gameState.p2.hp > 0 ? gameState.p2.color : 'red'; ctx.fillText(`P2 HP: ${Math.max(0, gameState.p2.hp)}`, 20, 90);

    if (gameState.over) {
        ctx.fillStyle = 'red'; ctx.font = '50px Courier New'; ctx.textAlign = 'center';
        ctx.fillText('MISSÃO FALHOU', W/2, H/2 - 30);
    }

    requestAnimationFrame(gameLoop);
}
</script>
</body>
</html>
